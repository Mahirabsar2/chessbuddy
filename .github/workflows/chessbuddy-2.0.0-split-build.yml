name: ChessBuddy Next Gen 1.0.0 Android build

on:
  workflow_dispatch:
  push:
    branches:
      - next-gen-1.0.0
    paths:
      - 'ChessBuddy-2.0.0-Part1-Stockfish.zip'
      - 'ChessBuddy-2.0.0-Part2-Stockfish.zip'
      - 'ChessBuddy-2.0.0-Part3-Stockfish.zip'
      - 'ChessBuddy-2.0.0-Part4-Stockfish.zip'
      - 'ChessBuddy-2.0.0-Part5-Source.zip'
      - '.github/workflows/chessbuddy-2.0.0-split-build.yml'
      - 'scripts/reassemble_stockfish.sh'
      - 'repairs/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CB_RELEASE_KEYSTORE_BASE64: ${{ secrets.CB_RELEASE_KEYSTORE_BASE64 }}
      CB_RELEASE_STORE_PASSWORD: ${{ secrets.CB_RELEASE_STORE_PASSWORD }}
      CB_RELEASE_KEY_ALIAS: ${{ secrets.CB_RELEASE_KEY_ALIAS }}
      CB_RELEASE_KEY_PASSWORD: ${{ secrets.CB_RELEASE_KEY_PASSWORD }}
    steps:
      - name: Check out Next Gen source branch
        uses: actions/checkout@v4
        with:
          ref: next-gen-1.0.0

      - name: Verify all five source ZIPs
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            ChessBuddy-2.0.0-Part1-Stockfish.zip \
            ChessBuddy-2.0.0-Part2-Stockfish.zip \
            ChessBuddy-2.0.0-Part3-Stockfish.zip \
            ChessBuddy-2.0.0-Part4-Stockfish.zip \
            ChessBuddy-2.0.0-Part5-Source.zip; do
            test -s "$file" || { echo "Missing $file"; exit 1; }
            unzip -tq "$file"
          done

      - name: Extract project source
        run: unzip -oq ChessBuddy-2.0.0-Part5-Source.zip -d .

      - name: Apply reviewed repair and Next Gen overlays
        shell: bash
        run: |
          set -euo pipefail
          python3 repairs/apply_repairs.py
          python3 repairs/nextgen_1_0_0.py
          python3 repairs/nextgen_updater_and_challenges.py
          python3 repairs/nextgen_review_ui.py
          python3 repairs/nextgen_layout_polish.py
          python3 repairs/nextgen_content_tabs.py
          python3 repairs/nextgen_maia_all9.py
          python3 repairs/nextgen_media_assets.py
          python3 repairs/nextgen_realtime.py
          node --check app/src/main/assets/js/app.js
          node --check app/src/main/assets/js/lichess.js
          node --check app/src/main/assets/js/online.js
          node --check app/src/main/assets/js/updater.js
          grep -q 'rv-summary-actions' app/src/main/assets/css/app.css
          grep -q 'rv-action-icon' app/src/main/assets/js/app.js
          grep -q 'view-puzzles' app/src/main/assets/index.html
          grep -q 'view-learn' app/src/main/assets/index.html
          grep -q 'view-watch' app/src/main/assets/index.html
          grep -q 'view-more' app/src/main/assets/index.html
          grep -q "versionName '1.0.0'" app/build.gradle

      - name: Install Android NDK and Rust toolchain
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;27.2.12479018'

      - name: Set up Rust for Android ARM64
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git pkg-config python3-venv protobuf-compiler

      - name: Rebuild Rust JNI core from source
        run: bash scripts/build_rust_android.sh

      - name: Rebuild Lc0 / Maia runtime from pinned source
        run: bash scripts/build_lc0_android.sh

      - name: Normalize and validate generated nine-model Maia manifest
        run: python3 repairs/normalize_maia_manifest.py

      - name: Reassemble and verify Stockfish
        run: bash scripts/reassemble_stockfish.sh .

      - name: Download and package original character media
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="chessbuddy-character-media-v1"
          ASSET_DIR="app/src/main/assets"
          MEDIA_ROOT="$RUNNER_TEMP/character-media"
          mkdir -p "$MEDIA_ROOT"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release download "$TAG" --pattern character-media-pack.zip --dir "$MEDIA_ROOT"
          else
            mkdir -p "$MEDIA_ROOT/media/avatars" "$MEDIA_ROOT/media/voices"
            curl -fL --retry 2 --silent --show-error "https://elevenlabsusercontent.com/database/workspace/30106093f1234a5c906777479e193826/content_generation/hwhIZhWrHZybOge29F5a/XB4UZtJ0E3IGTDjUpLYL/content.jpg?Expires=1795251600&KeyName=assets-cdn-key-1&Signature=ULI0m0KlyTzae1A9n3eD_G1T8mY=" -o "$MEDIA_ROOT/media/avatars/mittens.jpg"
            curl -fL --retry 2 --silent --show-error "https://elevenlabsusercontent.com/database/workspace/30106093f1234a5c906777479e193826/content_generation/wWxiTRJbGnIEzLh4AaJB/ztbYoQp1gY0SV5le8pve/content.jpg?Expires=1795251600&KeyName=assets-cdn-key-1&Signature=bV9XO-M8vRvSxEdLm9UeVy4IUdE=" -o "$MEDIA_ROOT/portrait-sheet.jpg"
            curl -fL --retry 2 --silent --show-error "https://elevenlabsusercontent.com/database/workspace/30106093f1234a5c906777479e193826/content_generation/IO9UVokpBgetC3AbWaR4/Y7U9Mo1pLOQM52jLHMhl/content.mp3?Expires=1795251600&KeyName=assets-cdn-key-1&Signature=E8ief0w0ugunOwcsjmVJgWKnbiQ=" -o "$MEDIA_ROOT/media/voices/mittens.mp3"
            curl -fL --retry 2 --silent --show-error "https://elevenlabsusercontent.com/database/workspace/30106093f1234a5c906777479e193826/content_generation/aXAXrNIADWHaz4z3Um7h/Xc2mMGDVCoBi5Iod5bt9/content.mp3?Expires=1795251600&KeyName=assets-cdn-key-1&Signature=8roiFEVMY_3cXRnp5ZuxUgCBS4Y=" -o "$MEDIA_ROOT/media/voices/streamer.mp3"
            curl -fL --retry 2 --silent --show-error "https://elevenlabsusercontent.com/database/workspace/30106093f1234a5c906777479e193826/content_generation/ZiPTx1yLGs0XYjX7VSrO/YOCNTjNEQynRldVk3Wgg/content.mp3?Expires=1795251600&KeyName=assets-cdn-key-1&Signature=0P5er-hrS2e5A8SUslYGJqhotkw=" -o "$MEDIA_ROOT/media/voices/coach.mp3"
            curl -fL --retry 2 --silent --show-error "https://elevenlabsusercontent.com/database/workspace/30106093f1234a5c906777479e193826/content_generation/8rDLDqa2DxFUDrgB4bHw/PmpSgDrv118g5FeIC2BX/content.mp3?Expires=1795251600&KeyName=assets-cdn-key-1&Signature=NqTJbYWFnCoWMycpOjKyycVNeks=" -o "$MEDIA_ROOT/media/voices/veteran.mp3"
            sudo apt-get update
            sudo apt-get install -y python3-pil zip
            python3 - "$MEDIA_ROOT/portrait-sheet.jpg" "$MEDIA_ROOT/media/avatars" <<'PY'
          from PIL import Image
          import sys
          src, dest = sys.argv[1], sys.argv[2]
          im = Image.open(src).convert("RGB")
          w, h = im.size
          if w < 800 or h < 600 or not (1.65 <= w / h <= 1.82):
              raise SystemExit("Expected a 16:9 four-character sheet, got %r" % (im.size,))
          # Generated sheet is a 2x2 grid; square-crop each cell without stretching.
          boxes = {
              "streamer": (0, 0, w//2, h//2),
              "coach": (w//2, 0, w, h//2),
              "veteran": (0, h//2, w//2, h),
              "prodigy": (w//2, h//2, w, h),
          }
          for name, box in boxes.items():
              tile = im.crop(box)
              tw, th = tile.size
              side = min(tw, th)
              left, top = (tw-side)//2, (th-side)//2
              tile.crop((left, top, left+side, top+side)).resize((512,512), Image.Resampling.LANCZOS).save(dest + "/" + name + ".jpg", "JPEG", quality=92, optimize=True)
          PY
            cat > "$MEDIA_ROOT/MEDIA_NOTES.txt" <<'TXT'
          ChessBuddy original character media pack v1.
          Media generated for ChessBuddy using ElevenLabs Creative Studio.
          Portraits are original, not public-figure likenesses.
          Voice clips are short archetype samples; no real-person voice cloning.
          TXT
            (cd "$MEDIA_ROOT" && zip -qr "$MEDIA_ROOT/character-media-pack.zip" media MEDIA_NOTES.txt)
            gh release create "$TAG" "$MEDIA_ROOT/character-media-pack.zip" --prerelease --title "ChessBuddy Character Media Pack v1" --notes "Original ChessBuddy bot portraits and short archetype voice clips. Reused by future Next Gen builds."
          fi
          if [ ! -f "$MEDIA_ROOT/character-media-pack.zip" ]; then
            test -s "$MEDIA_ROOT/character-media-pack.zip"
          fi
          unzip -oq "$MEDIA_ROOT/character-media-pack.zip" -d "$ASSET_DIR"
          for f in media/avatars/mittens.jpg media/avatars/streamer.jpg media/avatars/coach.jpg media/avatars/veteran.jpg media/avatars/prodigy.jpg media/voices/mittens.mp3 media/voices/streamer.mp3 media/voices/coach.mp3 media/voices/veteran.mp3; do
            test -s "$ASSET_DIR/$f" || { echo "Missing character media asset: $f"; exit 1; }
          done
          (cd "$ASSET_DIR" && sha256sum media/avatars/*.jpg media/voices/*.mp3 > media/CHARACTER_MEDIA_SHA256SUMS.txt)
          echo "Original character media pack installed into Android assets."
          

      - name: Verify all native ARM64 engines and core
        shell: bash
        run: |
          set -euo pipefail
          for binary in app/src/main/jniLibs/arm64-v8a/libstockfish.so app/src/main/jniLibs/arm64-v8a/liblc0.so app/src/main/jniLibs/arm64-v8a/libchessbuddy_core.so; do
            test -s "$binary"
            file "$binary" | grep -q 'ARM aarch64'
          done
          test -s build-info/lc0.txt
          test -s build-info/stockfish.txt || test -s build-info/STOCKFISH_PROVENANCE.txt


      - name: Package extracted source for inspection
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude='./.git' --exclude='./.gradle' --exclude='./app/build' -czf "$RUNNER_TEMP/chessbuddy-nextgen-1.0.0-source.tar.gz" .

      - name: Upload extracted source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: ChessBuddy-NextGen-1.0.0-extracted-source
          path: ${{ runner.temp }}/chessbuddy-nextgen-1.0.0-source.tar.gz
          if-no-files-found: error

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run JavaScript tests
        run: node tests/run-all.js

      - name: Verify authenticated Realtime game subscriptions
        run: node tests/logic/online-realtime.test.js

      - name: Verify offline Puzzle Rush mate positions
        run: node tests/logic/puzzle-rush.test.js

      - name: Run Java policy tests
        run: bash tests/java/run.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure persistent signing key
        if: ${{ env.CB_RELEASE_KEYSTORE_BASE64 != '' }}
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/chessbuddy-release.jks"
          printf '%s' "$CB_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          {
            echo "CB_KEYSTORE_FILE=$KEYSTORE"
            echo "CB_KEYSTORE_PASSWORD=$CB_RELEASE_STORE_PASSWORD"
            echo "CB_KEY_ALIAS=$CB_RELEASE_KEY_ALIAS"
            echo "CB_KEY_PASSWORD=$CB_RELEASE_KEY_PASSWORD"
            echo "CB_SIGNING_MODE=persistent"
          } >> "$GITHUB_ENV"

      - name: Create preview-only signing key when release secrets are absent
        if: ${{ env.CB_RELEASE_KEYSTORE_BASE64 == '' }}
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/chessbuddy-preview.jks"
          keytool -genkeypair -noprompt \
            -keystore "$KEYSTORE" \
            -storepass changeit -keypass changeit \
            -alias chessbuddy -keyalg RSA -keysize 2048 -validity 3650 \
            -dname "CN=ChessBuddy Next Gen Preview, OU=Build, O=ChessBuddy, C=US"
          {
            echo "CB_KEYSTORE_FILE=$KEYSTORE"
            echo "CB_KEYSTORE_PASSWORD=changeit"
            echo "CB_KEY_ALIAS=chessbuddy"
            echo "CB_KEY_PASSWORD=changeit"
            echo "CB_SIGNING_MODE=preview-only"
          } >> "$GITHUB_ENV"

      - name: Build signed Android APK
        run: gradle --no-daemon assembleRelease

      - name: Verify and stage release APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n1)"
          test -n "$APK" && test -s "$APK"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          APK_BYTES="$(stat -c '%s' "$APK")"
          echo "APK size: $APK_BYTES bytes"
          echo "apk_bytes=$APK_BYTES" >> "$GITHUB_OUTPUT"
          echo "signing_mode=$CB_SIGNING_MODE" >> "$GITHUB_OUTPUT"
          if [ "$CB_SIGNING_MODE" = "persistent" ]; then echo "release_ready=true" >> "$GITHUB_OUTPUT"; else echo "release_ready=false" >> "$GITHUB_OUTPUT"; fi
          cp "$APK" "$RUNNER_TEMP/ChessBuddy-NextGen-1.0.0.apk"
          if [ "$CB_SIGNING_MODE" != "persistent" ]; then
            echo "::warning::Preview signing only. Add the stable release keystore secrets before publishing auto-update releases."
          fi

      - name: Upload Next Gen APK candidate (not a public release)
        uses: actions/upload-artifact@v4
        with:
          name: ChessBuddy-NextGen-1.0.0-preview-apk
          path: ${{ runner.temp }}/ChessBuddy-NextGen-1.0.0.apk
          if-no-files-found: error


      - name: Publish preview APK for direct download
        if: ${{ steps.apk.outputs.signing_mode == 'preview-only' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/ChessBuddy-NextGen-1.0.0.apk"
          SHA="$RUNNER_TEMP/ChessBuddy-NextGen-1.0.0.apk.sha256"
          sha256sum "$APK" | awk '{print $1 "  ChessBuddy-NextGen-1.0.0-preview.apk"}' > "$SHA"
          cp "$APK" "$RUNNER_TEMP/ChessBuddy-NextGen-1.0.0-preview.apk"
          TAG="nextgen-1.0.0-preview-build$GITHUB_RUN_NUMBER"
          gh release create "$TAG" "$RUNNER_TEMP/ChessBuddy-NextGen-1.0.0-preview.apk" "$SHA" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "ChessBuddy Next Gen 1.0.0 Preview (build $GITHUB_RUN_NUMBER)" \
            --notes "Preview build for testing. This APK uses a temporary preview signing key, so later builds cannot update it in place. Install as a fresh app. This is not a stable auto-update release."

      - name: Publish verified stable release for in-app updates
        if: ${{ steps.apk.outputs.release_ready == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/ChessBuddy-NextGen-1.0.0.apk"
          SHA="$RUNNER_TEMP/ChessBuddy-NextGen-1.0.0.apk.sha256"
          sha256sum "$APK" | awk '{print $1 "  ChessBuddy-NextGen-1.0.0.apk"}' > "$SHA"
          TAG="nextgen-1.0.0-build$GITHUB_RUN_NUMBER"
          gh release create "$TAG" "$APK" "$SHA" \
            --target "$GITHUB_SHA" \
            --title "ChessBuddy Next Gen 1.0.0 (build $GITHUB_RUN_NUMBER)" \
            --notes "Verified ChessBuddy Next Gen 1.0.0 release. SHA-256 checksum is included. Android will request approval before installation."
