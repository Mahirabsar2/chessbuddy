name: ChessBuddy 2.0.0 split-source Android build

on:
  workflow_dispatch:
  push:
    branches:
      - chessbuddy-2.0.0-rebuild
    paths:
      - 'ChessBuddy-2.0.0-Part1-Stockfish.zip'
      - 'ChessBuddy-2.0.0-Part2-Stockfish.zip'
      - 'ChessBuddy-2.0.0-Part3-Stockfish.zip'
      - 'ChessBuddy-2.0.0-Part4-Stockfish.zip'
      - 'ChessBuddy-2.0.0-Part5-Source.zip'
      - '.github/workflows/chessbuddy-2.0.0-split-build.yml'
      - 'scripts/reassemble_stockfish.sh'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out split-source branch
        uses: actions/checkout@v4
        with:
          ref: chessbuddy-2.0.0-rebuild

      - name: Verify all five source ZIPs
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            ChessBuddy-2.0.0-Part1-Stockfish.zip \
            ChessBuddy-2.0.0-Part2-Stockfish.zip \
            ChessBuddy-2.0.0-Part3-Stockfish.zip \
            ChessBuddy-2.0.0-Part4-Stockfish.zip \
            ChessBuddy-2.0.0-Part5-Source.zip; do
            test -s "$file" || { echo "Missing $file"; exit 1; }
            unzip -tq "$file"
          done

      - name: Extract project source
        run: unzip -oq ChessBuddy-2.0.0-Part5-Source.zip -d .

      - name: Reassemble and verify Stockfish
        run: bash scripts/reassemble_stockfish.sh .

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run JavaScript tests
        run: node tests/run-all.js

      - name: Run Java policy tests
        run: bash tests/java/run.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Android release APK
        run: gradle --no-daemon assembleRelease

      - name: Align and sign release APK for device testing
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          UNSIGNED_APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n1)"
          test -n "$UNSIGNED_APK" && test -s "$UNSIGNED_APK"
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/chessbuddy-test-release.jks" \
            -storepass changeit -keypass changeit \
            -alias chessbuddy-test -keyalg RSA -keysize 2048 -validity 3650 \
            -dname "CN=ChessBuddy CI Test, OU=Build, O=ChessBuddy, C=US"
          zipalign -f -p 4 "$UNSIGNED_APK" "$RUNNER_TEMP/chessbuddy-release-aligned.apk"
          apksigner sign \
            --ks "$RUNNER_TEMP/chessbuddy-test-release.jks" \
            --ks-key-alias chessbuddy-test \
            --ks-pass pass:changeit --key-pass pass:changeit \
            --out "$RUNNER_TEMP/ChessBuddy-2.0.0-release.apk" \
            "$RUNNER_TEMP/chessbuddy-release-aligned.apk"
          apksigner verify --verbose "$RUNNER_TEMP/ChessBuddy-2.0.0-release.apk"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: ChessBuddy-2.0.0-release-apk
          path: ${{ runner.temp }}/ChessBuddy-2.0.0-release.apk
          if-no-files-found: error
