name: ChessBuddy 2.0.0 split-source Android build

on:
  workflow_dispatch:
  push:
    branches:
      - chessbuddy-2.0.0-rebuild
    paths:
      - 'source-parts/**'
      - '.github/workflows/chessbuddy-2.0.0-split-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out split-source branch
        uses: actions/checkout@v4
        with:
          ref: chessbuddy-2.0.0-rebuild

      - name: Verify all five source ZIPs are present
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            ChessBuddy-2.0.0-Part1-Stockfish.zip \
            ChessBuddy-2.0.0-Part2-Stockfish.zip \
            ChessBuddy-2.0.0-Part3-Stockfish.zip \
            ChessBuddy-2.0.0-Part4-Stockfish.zip \
            ChessBuddy-2.0.0-Part5-Source.zip; do
            test -s "source-parts/$file" || { echo "Missing source-parts/$file"; exit 1; }
            unzip -tq "source-parts/$file"
          done

      - name: Extract project source
        run: unzip -q source-parts/ChessBuddy-2.0.0-Part5-Source.zip -d .

      - name: Reassemble and verify Stockfish
        run: bash scripts/reassemble_stockfish.sh "$GITHUB_WORKSPACE/source-parts"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run JavaScript tests
        run: node tests/run-all.js

      - name: Run Java policy tests
        run: bash tests/java/run.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Android debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChessBuddy-2.0.0-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
