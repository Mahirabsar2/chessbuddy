name: ChessBuddy Next Gen 1.0.0 Android Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Semantic app version (increase for every published update)'
        required: true
        default: '1.0.0'
        type: string
  push:
    branches: [chessbuddy-nextgen-1.0.0]
    paths:
      - 'repairs/**'
      - '.github/workflows/nextgen-1.0.0.yml'

permissions:
  contents: write

concurrency:
  group: chessbuddy-nextgen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      NDK_VERSION: "27.2.12479018"
      VERSION_NAME: ${{ github.event.inputs.version_name || '1.0.0' }}
    steps:
      - name: Checkout Next Gen branch
        uses: actions/checkout@v4

      - name: Verify source parts
        shell: bash
        run: |
          set -euo pipefail
          for f in ChessBuddy-2.0.0-Part1-Stockfish.zip ChessBuddy-2.0.0-Part2-Stockfish.zip ChessBuddy-2.0.0-Part3-Stockfish.zip ChessBuddy-2.0.0-Part4-Stockfish.zip ChessBuddy-2.0.0-Part5-Source.zip; do
            test -s "$f"
            unzip -tq "$f"
          done

      - name: Extract source and apply Next Gen overlays
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p project
          unzip -oq ChessBuddy-2.0.0-Part5-Source.zip -d project
          mkdir -p project/repairs
          cp repairs/apply_repairs.py project/repairs/apply_repairs.py
          {
            for i in 00 01 02 03 04 05 06 07 08 09; do
              cat "repairs/nextgen-payload-b64/chunk${i}.txt"
            done
          } | base64 --decode | tar -xz -C project/repairs
          cd project
          python3 repairs/apply_repairs.py
          python3 repairs/nextgen-payload/apply_nextgen.py
          test -f app/src/main/assets/js/nextgen/community.js
          test -f app/src/main/assets/js/nextgen/tools.js
          test -f app/src/main/assets/bot-portrait-atlas.webp
          grep -q 'data-tab="coach"' app/src/main/assets/index.html

      - name: Run JavaScript tests
        working-directory: project
        run: node tests/run-all.js

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run Java policy tests
        working-directory: project
        run: bash tests/java/run.sh

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_HOME="$SDK"
          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;${NDK_VERSION}"

      - name: Export NDK location
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID_NDK_HOME=$SDK/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Reassemble verified Stockfish binary
        working-directory: project
        run: |
          mkdir -p source-parts
          cp "$GITHUB_WORKSPACE"/ChessBuddy-2.0.0-Part{1,2,3,4}-Stockfish.zip source-parts/
          bash scripts/reassemble_stockfish.sh

      - name: Build Lc0 and bundle all nine Maia models
        working-directory: project
        run: bash scripts/build_lc0_android.sh

      - name: Build Rust move-validation library
        working-directory: project
        run: bash scripts/build_rust_android.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Require persistent signing key for published releases
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          CB_KEYSTORE_BASE64: ${{ secrets.CHESSBUDDY_KEYSTORE_BASE64 }}
          CB_KEYSTORE_PASSWORD: ${{ secrets.CHESSBUDDY_KEYSTORE_PASSWORD }}
          CB_KEY_ALIAS: ${{ secrets.CHESSBUDDY_KEY_ALIAS }}
          CB_KEY_PASSWORD: ${{ secrets.CHESSBUDDY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for v in CB_KEYSTORE_BASE64 CB_KEYSTORE_PASSWORD CB_KEY_ALIAS CB_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing GitHub Actions secret $v. A persistent signing key is required for safe in-place app updates."
              exit 1
            fi
          done

      - name: Load persistent release signing key
        if: secrets.CHESSBUDDY_KEYSTORE_BASE64 != ''
        shell: bash
        env:
          CB_KEYSTORE_BASE64: ${{ secrets.CHESSBUDDY_KEYSTORE_BASE64 }}
          CB_KEYSTORE_PASSWORD: ${{ secrets.CHESSBUDDY_KEYSTORE_PASSWORD }}
          CB_KEY_ALIAS: ${{ secrets.CHESSBUDDY_KEY_ALIAS }}
          CB_KEY_PASSWORD: ${{ secrets.CHESSBUDDY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/chessbuddy-release.jks"
          printf '%s' "$CB_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass "$CB_KEYSTORE_PASSWORD" -alias "$CB_KEY_ALIAS" >/dev/null
          {
            echo "CB_KEYSTORE_FILE=$KEYSTORE"
            echo "CB_KEYSTORE_PASSWORD=$CB_KEYSTORE_PASSWORD"
            echo "CB_KEY_ALIAS=$CB_KEY_ALIAS"
            echo "CB_KEY_PASSWORD=$CB_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Create temporary signing key for CI-only validation
        if: secrets.CHESSBUDDY_KEYSTORE_BASE64 == ''
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/chessbuddy-ci-only.jks"
          keytool -genkeypair -noprompt -keystore "$KEYSTORE" -storepass changeit -keypass changeit \
            -alias chessbuddy -keyalg RSA -keysize 3072 -validity 3650 \
            -dname "CN=ChessBuddy CI Validation, OU=Temporary, O=ChessBuddy, C=BD"
          {
            echo "CB_KEYSTORE_FILE=$KEYSTORE"
            echo "CB_KEYSTORE_PASSWORD=changeit"
            echo "CB_KEY_ALIAS=chessbuddy"
            echo "CB_KEY_PASSWORD=changeit"
          } >> "$GITHUB_ENV"

      - name: Apply requested version name
        working-directory: project
        shell: bash
        run: sed -i \"s/versionName '1.0.0'/versionName '$VERSION_NAME'/\" app/build.gradle

      - name: Build signed release APK
        working-directory: project
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Verify APK and enforce requested package size
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          bash scripts/verify_apk.sh "$APK" build-info/VERIFIED_CHECKS.txt
          BYTES="$(stat -c %s "$APK")"
          echo "APK_BYTES=$BYTES" >> "$GITHUB_ENV"
          echo "APK size: $BYTES bytes"
          if [ "$BYTES" -lt 200000000 ]; then
            echo "::error::The APK is below the requested 200 MB minimum ($BYTES bytes). Do not publish this build as final."
            exit 1
          fi

      - name: Stage release files
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk "release/ChessBuddy-NextGen-${VERSION_NAME}.apk"
          cp build-info/VERIFIED_CHECKS.txt release/
          cp build-info/stockfish.txt release/STOCKFISH_PROVENANCE.txt
          cp build-info/lc0.txt release/LC0_PROVENANCE.txt
          sha256sum release/* > release/SHA256SUMS.txt

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ChessBuddy-NextGen-1.0.0
          path: project/release/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release for in-app updates
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: ChessBuddy Next Gen ${{ env.VERSION_NAME }}
          generate_release_notes: true
          files: project/release/ChessBuddy-NextGen-${{ env.VERSION_NAME }}.apk
          fail_on_unmatched_files: true
