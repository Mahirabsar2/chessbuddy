name: Build ChessBuddy 0.5.0 APK

on:
  push:
    branches: [chessbuddy-0.5.0-dev, chessbuddy-0.5.0-server-validation-dev-v2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chessbuddy-0.5.0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NDK_VERSION: "27.2.12479018"
    steps:
      - uses: actions/checkout@v4

      - name: Extract the uploaded server-validation source ZIP
        working-directory: .
        run: |
          set -euo pipefail
          ARCHIVE="ChessBuddy-0.5.0-server-validation-dev-v2.zip"
          test -f "$ARCHIVE"
          mkdir -p project
          unzip -q "$ARCHIVE" -d project
          test -f project/ChessBuddy/app/build.gradle
          test -f project/ChessBuddy/app/src/main/assets/js/online.js
          grep -q "versionName '0.5.0'" project/ChessBuddy/app/build.gradle
          test -f project/ChessBuddy/tests/logic/online-server-validation.test.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform, build-tools and NDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${SDK}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run complete project tests
        working-directory: project/ChessBuddy
        run: node tests/run-all.js

      - name: Build Stockfish for Android arm64
        working-directory: project/ChessBuddy
        run: bash scripts/build_stockfish_android.sh

      - name: Create temporary CI signing key
        working-directory: project/ChessBuddy
        run: |
          set -euo pipefail
          PASS="$(openssl rand -hex 24)"
          echo "::add-mask::$PASS"
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/chessbuddy-ci.keystore" \
            -storepass "$PASS" -keypass "$PASS" -alias chessbuddy-ci \
            -keyalg RSA -keysize 2048 -validity 3650 \
            -dname "CN=ChessBuddy Personal Build, OU=Development, O=ChessBuddy, C=BD"
          echo "CB_KEYSTORE_FILE=$RUNNER_TEMP/chessbuddy-ci.keystore" >> "$GITHUB_ENV"
          echo "CB_KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "CB_KEY_ALIAS=chessbuddy-ci" >> "$GITHUB_ENV"
          echo "CB_KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: project/ChessBuddy
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Verify APK
        working-directory: project/ChessBuddy
        run: bash scripts/verify_apk.sh app/build/outputs/apk/release/app-release.apk build-info/VERIFIED_CHECKS.txt

      - name: Package APK and matching patched source
        working-directory: project/ChessBuddy
        run: |
          set -euo pipefail
          VER="$(grep -m1 versionName app/build.gradle | sed -E "s/.*'([^']+)'.*/\\1/")"
          NAME="ChessBuddy-v${VER}-build${GITHUB_RUN_NUMBER}"
          mkdir -p "$GITHUB_WORKSPACE/release"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/release/${NAME}-arm64.apk"
          rm -f app/sideload.keystore
          (cd "$GITHUB_WORKSPACE/project" && zip -qr "$GITHUB_WORKSPACE/release/${NAME}-source.zip" ChessBuddy \
            -x 'ChessBuddy/.gradle/*' 'ChessBuddy/**/build/*' 'ChessBuddy/build-info/*' \
               'ChessBuddy/release/*' 'ChessBuddy/app/src/main/jniLibs/*')
          cp build-info/VERIFIED_CHECKS.txt "$GITHUB_WORKSPACE/release/VERIFIED_CHECKS.txt"
          cp build-info/stockfish.txt "$GITHUB_WORKSPACE/release/STOCKFISH_PROVENANCE.txt"
          APK_SHA="$(sha256sum "$GITHUB_WORKSPACE/release/${NAME}-arm64.apk" | cut -d' ' -f1)"
          {
            echo "ChessBuddy ${VER} (build ${GITHUB_RUN_NUMBER})"
            echo "Commit: ${GITHUB_SHA}"
            echo "APK: ${NAME}-arm64.apk"
            echo "APK sha256: ${APK_SHA}"
            echo "Source archive: ${NAME}-source.zip (the patched source used to build this APK)"
            echo "Toolchain: Java 17, Gradle 8.9, NDK ${NDK_VERSION}"
            echo "Signing: ephemeral personal sideload key; not for Play Store or update installs from another run"
            echo
            cat build-info/stockfish.txt
          } > "$GITHUB_WORKSPACE/release/BUILD_INFO.txt"
          (cd "$GITHUB_WORKSPACE/release" && sha256sum * > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: ChessBuddy-0.5.0-build-${{ github.run_number }}
          path: release/*
          if-no-files-found: error
          retention-days: 14
