name: Build ChessBuddy APK

on:
  push:
    branches: [main, master, Mahirabsar2-patch-7]
    paths-ignore:
      - 'PROJECT_STATUS.md'
      - 'PROJECT_LOG.md'
      - 'PROJECT_LOG_*.md'
      - 'README.md'
      - 'BUILD_ON_GITHUB.md'
      - 'NOTICE.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chessbuddy-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      NDK_VERSION: "27.2.12479018"
    defaults:
      run:
        working-directory: project/ChessBuddy
    steps:
      - uses: actions/checkout@v4

      - name: Extract ChessBuddy Patch 7 source
        working-directory: .
        run: |
          set -euo pipefail
          ZIP="ChessBuddy-v1.0.0-rc1-lc0-patch5-rustfix-source-1.zip"
          test -f "$ZIP"
          mkdir -p project
          unzip -q "$ZIP" -d project
          APP_GRADLE="$(find project -path '*/app/build.gradle' -print -quit)"
          test -n "$APP_GRADLE" || { echo "No app/build.gradle found in source ZIP"; exit 1; }
          SOURCE_ROOT="$(dirname "$(dirname "$APP_GRADLE")")"
          mkdir -p project/ChessBuddy
          if [ "$SOURCE_ROOT" != "project/ChessBuddy" ]; then cp -a "$SOURCE_ROOT"/. project/ChessBuddy/; fi
          test -f project/ChessBuddy/app/build.gradle
          test -f project/ChessBuddy/scripts/build_stockfish_android.sh
          test -f project/ChessBuddy/scripts/build_lc0_android.sh
          test -f project/ChessBuddy/scripts/build_rust_android.sh
          test -f project/ChessBuddy/scripts/verify_apk.sh
          grep -m1 versionName project/ChessBuddy/app/build.gradle
          echo "Source root: $SOURCE_ROOT"

      - name: Verify Maia provider integration and fix verifier quoting
        working-directory: .
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, zipfile, os

          root = Path("project/ChessBuddy")
          strength = (root / "app/src/main/assets/js/strength.js").read_text()
          app = (root / "app/src/main/assets/js/app.js").read_text()
          native = (root / "app/src/main/java/com/chessbuddy/NativeBridge.java").read_text()

          checks = {
              "Maia roster assigns the LC0 provider": re.search(r"MAIA\\.forEach\\(function \\(b\\) \\{ b\\.engine = ['\\"]lc0['\\"];", strength),
              "Maia bots are included in the selectable roster": "BOTS = BOTS.concat(GM, LEGENDS, CHARACTERS, GENERATED, VIS, MAIA);" in strength,
              "game flow selects the bot's engine provider": "engine.useProvider(p.engine || 'stockfish', p.modelId || '')" in app,
              "game flow supplies the verified Maia weights": "Native.maiaModelPath(p.modelId)" in app and "WeightsFile" in app,
              "native bridge starts the selected provider": "engineStart(String provider, String modelId)" in native and 'path = lc0Path(); name = "Lc0 / " + selectedModel;' in native,
              "native bridge configures Maia policyhead": "--search-algorithm=policyhead" in native and "--backend=blas" in native,
          }
          failed = [name for name, ok in checks.items() if not ok]
          for name, ok in checks.items():
              print(("PASS " if ok else "FAIL ") + name)
          if failed:
              raise SystemExit("Maia provider integration is incomplete: " + "; ".join(failed))

          verifier_path = root / "scripts/verify_apk.sh"
          verifier = verifier_path.read_text()
          old_check = """grep -q '\\"lc0\\"' app/src/main/assets/js/strength.js || fail "Maia bot roster is not wired to the Lc0 provider" """
          if old_check not in verifier:
              # Match the exact line independent of trailing whitespace.
              lines = verifier.splitlines()
              matches = [i for i, line in enumerate(lines) if 'Maia bot roster is not wired to the Lc0 provider' in line]
              if len(matches) != 1:
                  raise SystemExit("Could not safely locate the old Maia roster verifier check")
              lines[matches[0]] = """grep -Fq "b.engine = 'lc0'" app/src/main/assets/js/strength.js || fail "Maia bot roster is not wired to the Lc0 provider" """
              verifier = "\\n".join(lines) + "\\n"
          else:
              verifier = verifier.replace(old_check, """grep -Fq "b.engine = 'lc0'" app/src/main/assets/js/strength.js || fail "Maia bot roster is not wired to the Lc0 provider" """)
          verifier_path.write_text(verifier)
          PY

          bash -n scripts/verify_apk.sh
          python3 - <<'PY'
          from pathlib import Path
          import os, zipfile
          archive = Path(os.environ["GITHUB_WORKSPACE"]) / "ChessBuddy-v1.0.0-rc1-lc0-patch5-rustfix-source-1.zip"
          replacement = Path("project/ChessBuddy/scripts/verify_apk.sh").read_bytes()
          target = "ChessBuddy/scripts/verify_apk.sh"
          tmp = archive.with_suffix(".fixed.zip")
          with zipfile.ZipFile(archive, "r") as src, zipfile.ZipFile(tmp, "w") as dst:
              names = [i.filename for i in src.infolist()]
              if names.count(target) != 1:
                  raise SystemExit(f"Expected exactly one {target} entry in source ZIP")
              for info in src.infolist():
                  data = replacement if info.filename == target else src.read(info.filename)
                  dst.writestr(info, data, compress_type=info.compress_type)
          tmp.replace(archive)
          with zipfile.ZipFile(archive) as check:
              assert check.testzip() is None
              assert b"b.engine = 'lc0'" in check.read(target)
          print("PASS source archive updated with corrected Maia verifier")
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform, build-tools and NDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${SDK}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run project tests
        run: node tests/run-all.js

      - name: Build Stockfish for Android arm64
        run: bash scripts/build_stockfish_android.sh

      - name: Build Lc0 and Maia model manifest for Android arm64
        run: bash scripts/build_lc0_android.sh

      - name: Build ChessBuddy Rust JNI core for Android arm64
        run: bash scripts/build_rust_android.sh

      - name: Configure personal APK signing
        run: |
          set -euo pipefail
          PASS="$(openssl rand -hex 24)"
          echo "::add-mask::$PASS"
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/chessbuddy.keystore" -storepass "$PASS" \
            -keypass "$PASS" -alias chessbuddy-sideload -keyalg RSA -keysize 2048 -validity 3650 \
            -dname "CN=ChessBuddy Personal Build, OU=Development, O=ChessBuddy, C=BD"
          echo "CB_KEYSTORE_FILE=$RUNNER_TEMP/chessbuddy.keystore" >> "$GITHUB_ENV"
          echo "CB_KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "CB_KEY_ALIAS=chessbuddy-sideload" >> "$GITHUB_ENV"
          echo "CB_KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"

      - name: Build release APK
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Verify APK (Stockfish + Lc0 + Maia + Rust)
        run: bash scripts/verify_apk.sh app/build/outputs/apk/release/app-release.apk build-info/VERIFIED_CHECKS.txt

      - name: Package APK and matching source archive
        run: |
          set -euo pipefail
          VER="$(grep -m1 versionName app/build.gradle | sed -E "s/.*'([^']+)'.*/\\1/")"
          NAME="ChessBuddy-v${VER}-build${GITHUB_RUN_NUMBER}"
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk "release/${NAME}-arm64.apk"
          cp "$GITHUB_WORKSPACE/ChessBuddy-v1.0.0-rc1-lc0-patch5-rustfix-source-1.zip" "release/${NAME}-source.zip"
          cp build-info/VERIFIED_CHECKS.txt release/VERIFIED_CHECKS.txt
          cp build-info/stockfish.txt release/STOCKFISH_PROVENANCE.txt
          cp build-info/lc0.txt release/LC0_PROVENANCE.txt
          APK_SHA="$(sha256sum "release/${NAME}-arm64.apk" | cut -d' ' -f1)"
          {
            echo "ChessBuddy ${VER} (build ${GITHUB_RUN_NUMBER})"
            echo "Commit: ${GITHUB_SHA}"
            echo "APK: ${NAME}-arm64.apk"
            echo "APK sha256: ${APK_SHA}"
            echo "Source archive: ${NAME}-source.zip"
            echo "Toolchain: Java 17, Gradle 8.9, NDK ${NDK_VERSION}, Rust stable"
            echo "Signing: ephemeral personal sideload key; not for Play Store"
            echo
            cat build-info/stockfish.txt
            echo
            cat build-info/lc0.txt
          } > release/BUILD_INFO.txt
          (cd release && sha256sum * > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: ChessBuddy-build-${{ github.run_number }}
          path: project/ChessBuddy/release/*
          if-no-files-found: error
          retention-days: 14
